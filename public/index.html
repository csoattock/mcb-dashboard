<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IESCO · MCB Collection Dashboard</title>
<link rel="icon" href="/logo.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root {
    --navy: #0b3556;
    --navy-deep: #082944;
    --paper: #f4f6f8;
    --panel: #ffffff;
    --line: #e1e6ea;
    --muted: #64748b;
    --accent: #c8102e;
    --accent-soft: #fdeaec;
    --gold: #c8951f;
    --credit: #157347;
    --debit: #b02a1f;
    --mono: 'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: var(--sans); background: var(--paper); color: #1c2b3a; }
  a { color: inherit; }

  .app { display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .side {
    width: 240px; flex: none; background: linear-gradient(180deg, var(--navy), var(--navy-deep));
    color: #dce7f0; display: flex; flex-direction: column;
  }
  .menu-toggle {
    display: none; align-items: center; justify-content: center; width: 34px; height: 34px;
    border: 1px solid var(--line); background: var(--panel); border-radius: 7px; cursor: pointer;
    font-size: 18px; color: var(--navy); flex: none;
  }
  .sidebar-overlay { display: none; }
  .side-brand { display: flex; align-items: center; gap: 10px; padding: 20px 18px 16px; border-bottom: 1px solid rgba(255,255,255,0.12); }
  .side-brand img { width: 38px; height: 38px; border-radius: 50%; background: #fff; padding: 2px; }
  .side-brand .t1 { font-size: 13px; font-weight: 700; letter-spacing: .02em; line-height: 1.25; }
  .side-brand .t2 { font-size: 11px; color: #93a9bd; margin-top: 1px; }

  .nav-group { padding: 14px 10px 4px; }
  .nav-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .09em; color: #6f8aa2; padding: 6px 10px 6px; }
  .nav-item {
    display: flex; align-items: center; gap: 9px; padding: 9px 12px; border-radius: 7px; cursor: pointer;
    font-size: 13.5px; color: #cddceb; margin-bottom: 1px; transition: background .12s;
  }
  .nav-item:hover { background: rgba(255,255,255,0.07); }
  .nav-item.active { background: var(--accent); color: #fff; font-weight: 600; }
  .nav-offices { max-height: 260px; overflow-y: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 2px 6px; padding: 2px 10px; }
  .nav-offices .nav-item { padding: 6px 8px; font-family: var(--mono); font-size: 12.5px; justify-content: center; }
  .side-foot { margin-top: auto; padding: 14px 18px; font-size: 11px; color: #6f8aa2; border-top: 1px solid rgba(255,255,255,0.12); }

  /* ---------- Main ---------- */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    background: var(--panel); border-bottom: 1px solid var(--line); padding: 16px 26px;
    display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  }
  .topbar h1 { margin: 0; font-size: 18px; font-weight: 700; }
  .topbar .sub { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .topbar-actions { display: flex; align-items: center; gap: 10px; }
  .search {
    padding: 8px 12px; border: 1px solid var(--line); border-radius: 7px; font-size: 13px;
    width: 240px; font-family: var(--sans); background: var(--paper);
  }
  .btn {
    padding: 8px 14px; border-radius: 7px; border: 1px solid var(--navy); background: var(--navy);
    color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--sans);
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { opacity: .92; }
  .btn.ghost { background: transparent; color: var(--navy); }

  .content { flex: 1; overflow: auto; padding: 22px 26px; }

  /* ---------- Cards / abstract ---------- */
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
  .card .label { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 6px; }
  .card .value { font-family: var(--mono); font-size: 21px; font-weight: 700; color: var(--navy); }
  .card .value.credit { color: var(--credit); }
  .card .value.debit { color: var(--debit); }

  /* ---------- Table ---------- */
  .table-wrap { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  /* table-layout:fixed forced columns to squeeze to fit the screen instead of
     letting the table overflow, which is what blocked horizontal scrolling.
     Auto layout + white-space:nowrap lets the table grow to its natural width
     and .table-scroll (above) scrolls it. */
  table.wrap-table {}
  thead th {
    position: sticky; background: #eef2f6; color: var(--navy); text-align: left; padding: 9px 10px;
    font-weight: 700; border-bottom: 2px solid var(--line); white-space: nowrap; z-index: 2; font-size: 12px;
    text-transform: uppercase; letter-spacing: .03em;
  }
  td.wrap, th.wrap {
    white-space: normal; word-break: break-word; width: 220px; max-width: 220px;
    vertical-align: middle; text-align: center;
  }
  tbody td { padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: middle; }
  tbody tr:hover { background: #f8fafc; }
  tr.total-row td { font-weight: 800; background: #eef2f6; border-top: 2px solid var(--navy); color: var(--navy); }
  tr.total-row:hover td { background: #eef2f6; }
  .grid th, .grid td { border-right: 1px solid var(--line); }
  .grid th:last-child, .grid td:last-child { border-right: none; }
  /* Frozen (sticky) columns for office-wise pivot tables — left offset,
     background and z-index are set inline per-cell in render() since they
     depend on which columns are frozen (date-only vs branch-info triple). */
  tbody tr:hover td.frozen-col { background: #f8fafc; }
  .num { font-family: var(--mono); text-align: right; }
  .credit { color: var(--credit); }
  .debit { color: var(--debit); }

  .pager { display: flex; align-items: center; gap: 10px; padding: 12px; font-size: 13px; color: var(--muted); }
  .pager button { font-family: var(--sans); font-size: 13px; padding: 5px 12px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
  .pager button:disabled { opacity: .4; cursor: default; }

  .state-msg { color: var(--muted); font-size: 14px; padding: 50px 0; text-align: center; }

  /* ---------- Branch picker ---------- */
  .branch-picker { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .branch-picker .search { width: 320px; }
  .branch-results { max-height: 260px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); margin-bottom: 18px; }
  .branch-result { padding: 8px 14px; font-size: 13px; cursor: pointer; display: flex; justify-content: space-between; border-bottom: 1px solid var(--line); }
  .branch-result:last-child { border-bottom: none; }
  .branch-result:hover { background: var(--accent-soft); }
  .branch-result .code { font-family: var(--mono); color: var(--navy); font-weight: 700; }
  .branch-result .meta { color: var(--muted); font-size: 12px; }

  @media (max-width: 800px) {
    .menu-toggle { display: inline-flex; }
    .side {
      position: fixed; top: 0; left: 0; height: 100vh; z-index: 1001;
      transform: translateX(-100%); transition: transform .22s ease;
      box-shadow: 6px 0 24px rgba(0,0,0,0.25);
    }
    .side.open { transform: translateX(0); }
    .sidebar-overlay {
      display: none; position: fixed; inset: 0; background: rgba(6,20,32,0.45); z-index: 1000;
    }
    .sidebar-overlay.show { display: block; }
    .search { width: 160px; }
  }

  /* ---------- Login ---------- */
  .login-wrap {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, var(--navy), var(--navy-deep)); padding: 20px;
  }
  .login-box {
    width: 100%; max-width: 340px; background: var(--panel); border-radius: 12px;
    padding: 30px 28px 26px; box-shadow: 0 12px 40px rgba(0,0,0,0.28);
  }
  .login-box .brand { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 18px; }
  .login-box .brand img { width: 46px; height: 46px; border-radius: 50%; }
  .login-box .brand .t1 { font-size: 15px; font-weight: 700; color: var(--navy); }
  .login-box .brand .t2 { font-size: 12px; color: var(--muted); }
  .login-box label { display: block; font-size: 12px; font-weight: 600; color: var(--navy); margin: 12px 0 5px; }
  .login-box input {
    width: 100%; padding: 9px 11px; border: 1px solid var(--line); border-radius: 7px;
    font-size: 13.5px; font-family: var(--sans); background: var(--paper);
  }
  .login-box .btn { width: 100%; justify-content: center; margin-top: 18px; padding: 10px 14px; }
  .login-error { color: var(--accent); font-size: 12.5px; margin-top: 10px; text-align: center; min-height: 16px; }
  .logout-btn { cursor: pointer; }
  .role-badge {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: #93a9bd;
    background: rgba(255,255,255,0.08); border-radius: 5px; padding: 2px 7px; margin-left: 6px;
  }
</style>
</head>
<body>

  <div class="login-wrap" id="loginWrap">
    <div class="login-box">
      <div class="brand">
        <img src="/logo.png" alt="IESCO logo">
        <div class="t1">IESCO</div>
        <div class="t2">MCB Collection Dashboard</div>
      </div>
      <form id="loginForm">
        <label for="loginUser">Username</label>
        <input type="text" id="loginUser" autocomplete="username" required>
        <label for="loginPass">Password</label>
        <input type="password" id="loginPass" autocomplete="current-password" required>
        <button type="submit" class="btn">Log In</button>
        <div class="login-error" id="loginError"></div>
      </form>
    </div>
  </div>

  <div class="app" id="appRoot" style="display:none;">
    <div class="sidebar-overlay" id="sidebarOverlay"></div>
    <nav class="side">
      <div class="side-brand">
        <img src="/logo.png" alt="IESCO logo">
        <div>
          <div class="t1">IESCO <span class="role-badge" id="roleBadge"></span></div>
          <div class="t2">MCB Collection Dashboard</div>
        </div>
      </div>

      <div class="nav-group">
        <div class="nav-item active" data-view="home">🏠 Home</div>
        <div class="nav-item" data-view="statement">📄 Statement</div>
        <div class="nav-item" data-view="reversal">↩️ Reversal</div>
        <div class="nav-item" data-view="branch">🔎 Branch-wise Statement</div>
      </div>

      <div class="nav-group" style="flex:1; overflow:hidden; display:flex; flex-direction:column;">
        <div class="nav-label">Offices</div>
        <div class="nav-offices" id="officeNav"></div>
      </div>

      <div class="side-foot" id="lastUpdated">Loading status…</div>
    </nav>

    <main class="main">
      <div class="topbar">
        <div style="display:flex; align-items:center; gap:12px;">
          <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">☰</button>
          <div>
            <h1 id="viewTitle">Home</h1>
            <div class="sub" id="viewSub">Overview and quick access</div>
          </div>
        </div>
        <div class="topbar-actions" id="topActions">
          <select class="search" id="monthSelect" style="width:150px;">
            <option value="All">All Months</option>
          </select>
          <input class="search" id="searchBox" placeholder="Search this view…" style="display:none">
          <button class="btn ghost" id="toggleViewBtn" style="display:none">⇄ Dates as Columns</button>
          <button class="btn ghost" id="downloadBtn" style="display:none">⬇ Download Excel</button>
          <button class="btn ghost" id="downloadPdfBtn" style="display:none">⬇ Download PDF</button>
          <button class="btn ghost logout-btn" id="logoutBtn">Log Out</button>
        </div>
      </div>
      <div class="content" id="content">
        <div class="state-msg">Loading…</div>
      </div>
    </main>
  </div>

<script>
const OFFICE_CODES = [
  '1411','1412','1413','1421','1424','1425','1431','1432','1435',
  '1441','1442','1443','1451','1452','1455','1456','1461','1463','1462','1464'
];
const PAGE_SIZE = 100;
const HEADER_ROW_HEIGHT = 34;

let sheetCache = {};       // name -> rows (2D array), cached for the session
let branchDirectory = [];  // [{office, name, mis, code}]
let currentHeaderRows = [];
let currentRows = [];
let filteredRows = [];
let currentViewLabel = 'home';
let page = 0;
let renderTargetId = 'content';
let selectedMonth = 'All';
let activeReload = () => loadHome();

// Office-wise tab: pivot data is cached so toggling the view (date-as-rows vs
// date-as-columns) re-renders instantly without re-fetching. officeTransposed
// resets to false (the default view) whenever a DIFFERENT office is opened,
// but is preserved across month-filter reloads of the same office.
let currentOfficeCode = null;
let officeTransposed = false;
let currentOfficePivot = null;

/* ---------------- AUTH ---------------- */
const ACCOUNTS = [
  { user: 'admin', pass: 'admin', role: 'admin' },
  { user: 'iesco', pass: 'iesco', role: 'user' }
];
let currentRole = null;

function applyRoleRestrictions() {
  const branchNav = document.querySelector('[data-view="branch"]');
  const roleBadge = document.getElementById('roleBadge');
  if (currentRole === 'user') {
    if (branchNav) branchNav.style.display = 'none';
    if (roleBadge) roleBadge.textContent = 'User';
  } else {
    if (branchNav) branchNav.style.display = '';
    if (roleBadge) roleBadge.textContent = 'Admin';
  }
}

function doLogin(username, password) {
  const match = ACCOUNTS.find(a => a.user === username && a.pass === password);
  if (!match) return false;
  currentRole = match.role;
  document.getElementById('loginWrap').style.display = 'none';
  document.getElementById('appRoot').style.display = '';
  applyRoleRestrictions();
  ensureMonthOptions();
  loadHome();
  loadStatus();
  return true;
}

document.getElementById('loginForm').addEventListener('submit', function (e) {
  e.preventDefault();
  const user = document.getElementById('loginUser').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  if (!doLogin(user, pass)) {
    errEl.textContent = 'Invalid username or password.';
  } else {
    errEl.textContent = '';
    this.reset();
  }
});

document.getElementById('logoutBtn').addEventListener('click', function () {
  currentRole = null;
  sheetCache = {};
  document.getElementById('appRoot').style.display = 'none';
  document.getElementById('loginWrap').style.display = '';
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
  document.getElementById('loginError').textContent = '';
});

async function ensureMonthOptions() {
  const sel = document.getElementById('monthSelect');
  if (sel.dataset.loaded) return;
  const rows = await fetchSheet('Statement');
  const header = rows[0];
  const monthIdx = header.findIndex(h => /^month$/i.test(h));
  const months = Array.from(new Set(rows.slice(1).map(r => r[monthIdx]).filter(Boolean)));
  months.sort((a, b) => new Date('1 ' + b) - new Date('1 ' + a)); // most recent first
  sel.innerHTML = '<option value="All">All Months</option>' +
    months.map(m => '<option value="' + escapeHtml_(m) + '">' + escapeHtml_(m) + '</option>').join('');
  sel.dataset.loaded = '1';
}
document.getElementById('monthSelect').addEventListener('change', e => {
  selectedMonth = e.target.value;
  activeReload();
});

async function fetchSheet(name) {
  if (sheetCache[name]) return sheetCache[name];
  const res = await fetch('/api/sheet?name=' + encodeURIComponent(name));
  const data = await res.json();
  if (data.error) throw new Error(data.error);
  sheetCache[name] = data.rows;
  return data.rows;
}

function setActiveNav(el) {
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  el.classList.add('active');
}
function setHeader(title, sub) {
  document.getElementById('viewTitle').textContent = title;
  document.getElementById('viewSub').textContent = sub;
}
function showLoading() {
  document.getElementById('content').innerHTML = '<div class="state-msg">Loading…</div>';
}
function showError(err) {
  document.getElementById('content').innerHTML =
    '<div class="state-msg">Could not load this view: ' + escapeHtml_(err.message || String(err)) + '</div>';
}
function toolbarFor(view) {
  const search = document.getElementById('searchBox');
  const dl = document.getElementById('downloadBtn');
  const dlPdf = document.getElementById('downloadPdfBtn');
  const toggleBtn = document.getElementById('toggleViewBtn');
  const show = view !== 'home' && view !== 'branch';
  search.style.display = show ? '' : 'none';
  dl.style.display = show ? '' : 'none';
  dlPdf.style.display = (show && currentRole !== 'user') ? '' : 'none';
  if (toggleBtn) toggleBtn.style.display = (view === 'office') ? '' : 'none';
}

/* ---------------- HOME ---------------- */
async function loadHome() {
  currentViewLabel = 'home';
  activeReload = loadHome;
  setHeader('Home', selectedMonth === 'All' ? 'Overview and quick access' : 'Overview — ' + selectedMonth);
  toolbarFor('home');
  showLoading();
  try {
    const rows = await fetchSheet('Statement');
    const header = rows[0];
    const monthIdx = header.findIndex(h => /^month$/i.test(h));
    const data = rows.slice(1).filter(r => selectedMonth === 'All' || r[monthIdx] === selectedMonth);
    const debitIdx = header.findIndex(h => /debit/i.test(h));
    const creditIdx = header.findIndex(h => /credit/i.test(h));
    const dateIdx = header.findIndex(h => /^date$/i.test(h));

    let totalDebit = 0, totalCredit = 0, lastDate = '';
    data.forEach(r => {
      totalDebit += parseFloat(String(r[debitIdx]).replace(/,/g, '')) || 0;
      totalCredit += parseFloat(String(r[creditIdx]).replace(/,/g, '')) || 0;
      if (r[dateIdx]) lastDate = r[dateIdx];
    });

    let html = '<div class="cards">' +
      card('Total Transactions', data.length.toLocaleString()) +
      card('Total Credit', fmtMoney(totalCredit), 'credit') +
      card('Total Debit', fmtMoney(totalDebit), 'debit') +
      card('Offices Tracked', OFFICE_CODES.length) +
      card('Last Statement Date', lastDate || '—') +
      '</div>';

    html += '<div class="cards" style="grid-template-columns:1fr;">' +
      '<div class="card"><div class="label">Quick access</div>' +
      '<div style="display:flex; gap:10px; flex-wrap:wrap; margin-top:8px;">' +
      quickBtn('statement', 'View full Statement') +
      quickBtn('reversal', 'View Reversals') +
      quickBtn('branch', 'Search a branch') +
      '</div></div></div>';

    document.getElementById('content').innerHTML = html;
    document.querySelectorAll('[data-goto]').forEach(b => {
      b.addEventListener('click', () => {
        const view = b.getAttribute('data-goto');
        document.querySelector('[data-view="' + view + '"]').click();
      });
    });
  } catch (err) { showError(err); }
}
function card(label, value, cls) {
  return '<div class="card"><div class="label">' + label + '</div><div class="value ' + (cls || '') + '">' + value + '</div></div>';
}
function quickBtn(view, label) {
  return '<button class="btn ghost" data-goto="' + view + '">' + label + '</button>';
}
function fmtMoney(n) {
  return 'Rs ' + Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

/* ---------------- Totals helpers (shared by Statement / Reversal / Branch statement) ---------------- */
function sumDebitCredit_(header, dataRows) {
  const debitIdx = header.findIndex(h => /debit/i.test(h));
  const creditIdx = header.findIndex(h => /credit/i.test(h));
  let totalDebit = 0, totalCredit = 0;
  dataRows.forEach(r => {
    totalDebit += parseFloat(String(r[debitIdx]).replace(/,/g, '')) || 0;
    totalCredit += parseFloat(String(r[creditIdx]).replace(/,/g, '')) || 0;
  });
  return { debitIdx, creditIdx, totalDebit, totalCredit };
}
// Appends a 'TOTAL' row (Debit/Credit columns summed) to a [header, ...rows] array,
// so the total is also baked into what gets exported to Excel/PDF.
function appendTotalsRow(rows) {
  if (!rows || rows.length <= 1) return rows;
  const header = rows[0];
  const data = rows.slice(1);
  const { debitIdx, creditIdx, totalDebit, totalCredit } = sumDebitCredit_(header, data);
  const totalRow = header.map(() => '');
  totalRow[0] = 'TOTAL';
  if (debitIdx !== -1) totalRow[debitIdx] = totalDebit.toFixed(2);
  if (creditIdx !== -1) totalRow[creditIdx] = totalCredit.toFixed(2);
  return rows.concat([totalRow]);
}
// Renders summary cards (Transactions / Total Credit / Total Debit) into containerId,
// with a nested tableAreaId div for the table itself to render into.
function renderTotalsCards(rows, containerId, tableAreaId) {
  const header = rows[0] || [];
  const data = rows.slice(1);
  const { totalDebit, totalCredit } = sumDebitCredit_(header, data);
  const html = '<div class="cards">' +
    card('Transactions', data.length.toLocaleString()) +
    card('Total Credit', fmtMoney(totalCredit), 'credit') +
    card('Total Debit', fmtMoney(totalDebit), 'debit') +
    '</div><div id="' + tableAreaId + '"></div>';
  document.getElementById(containerId).innerHTML = html;
}

/* ---------------- STATEMENT / REVERSAL ---------------- */
async function loadStatement() {
  currentViewLabel = 'statement';
  activeReload = loadStatement;
  setHeader('Statement', selectedMonth === 'All' ? 'Full transaction ledger' : 'Full transaction ledger — ' + selectedMonth);
  toolbarFor('statement');
  showLoading();
  try {
    const rows = sortByDate_(filterByMonth_(await fetchSheet('Statement')));
    renderTotalsCards(rows, 'content', 'statementTableArea');
    onData(appendTotalsRow(rows), 1, 'statementTableArea');
  } catch (err) { showError(err); }
}
async function loadReversal() {
  currentViewLabel = 'reversal';
  activeReload = loadReversal;
  setHeader('Reversal', selectedMonth === 'All' ? 'Transactions logged as reversals' : 'Reversals — ' + selectedMonth);
  toolbarFor('reversal');
  showLoading();
  try {
    const rows = sortByDate_(filterByMonth_(await fetchSheet('Reversal')));
    renderTotalsCards(rows, 'content', 'reversalTableArea');
    onData(appendTotalsRow(rows), 1, 'reversalTableArea');
  } catch (err) { showError(err); }
}
function filterByMonth_(rows) {
  if (selectedMonth === 'All' || rows.length === 0) return rows;
  const header = rows[0];
  const monthIdx = header.findIndex(h => /^month$/i.test(h));
  if (monthIdx === -1) return rows;
  return [header].concat(rows.slice(1).filter(r => r[monthIdx] === selectedMonth));
}
// Sorts a [header, ...dataRows] array by its Date column, ascending — the
// underlying Google Sheet isn't always kept in date order, so this is applied
// wherever a Date column exists rather than trusting the sheet's row order.
function sortByDate_(rows) {
  if (!rows || rows.length <= 1) return rows;
  const header = rows[0];
  const dateIdx = header.findIndex(h => /^date$/i.test(h));
  if (dateIdx === -1) return rows;
  const data = rows.slice(1).slice().sort((a, b) => new Date(a[dateIdx]) - new Date(b[dateIdx]));
  return [header].concat(data);
}
async function ensureBranchDirectory() {
  if (branchDirectory.length === 0) {
    const rows = await fetchSheet('Branch Directory');
    branchDirectory = rows.slice(1).map(r => ({ office: r[0], name: r[1], mis: r[2], code: r[3] }));
  }
  return branchDirectory;
}

async function loadOffice(code) {
  currentViewLabel = 'office_' + code;
  activeReload = () => loadOffice(code);
  // Only reset to the default (date-as-rows) view when switching to a
  // DIFFERENT office. Re-loading the same office (e.g. changing the month
  // filter) keeps whichever view the user toggled to.
  if (currentOfficeCode !== code) {
    officeTransposed = false;
    currentOfficeCode = code;
  }
  setHeader('Office ' + code, 'Daily collection summary' + (selectedMonth !== 'All' ? ' — ' + selectedMonth : ''));
  toolbarFor('office');
  showLoading();
  try {
    await ensureBranchDirectory();
    const branches = branchDirectory.filter(b => b.office === code).sort((a, b) => a.code.localeCompare(b.code));
    if (branches.length === 0) {
      document.getElementById('content').innerHTML = '<div class="state-msg">No branches found for office ' + code + ' in Branch Directory. Try re-running buildBranchDirectory() in Apps Script.</div>';
      return;
    }

    const stRows = await fetchSheet('Statement');
    const header = stRows[0];
    const dateIdx = header.findIndex(h => /^date$/i.test(h));
    const monthIdx = header.findIndex(h => /^month$/i.test(h));
    const branchIdx = header.findIndex(h => /^branch$/i.test(h));
    const creditIdx = header.findIndex(h => /credit/i.test(h));

    const branchCodeSet = new Set(branches.map(b => b.code));
    let data = stRows.slice(1).filter(r => branchCodeSet.has(String(r[branchIdx]).trim()));
    if (selectedMonth !== 'All') data = data.filter(r => r[monthIdx] === selectedMonth);

    // Pivot: date -> branchCode -> summed credit for that day.
    const dateMap = {};
    data.forEach(r => {
      const d = r[dateIdx];
      const b = String(r[branchIdx]).trim();
      const c = parseFloat(String(r[creditIdx]).replace(/,/g, '')) || 0;
      if (!dateMap[d]) dateMap[d] = {};
      dateMap[d][b] = (dateMap[d][b] || 0) + c;
    });
    const dates = Object.keys(dateMap).sort((a, b) => new Date(a) - new Date(b));
    const branchCodes = branches.map(b => b.code);

    let grand = 0;
    const branchColumnTotals = {};
    branchCodes.forEach(bc => { branchColumnTotals[bc] = 0; });
    const dateTotals = {};
    dates.forEach(d => {
      let rowTotal = 0;
      branchCodes.forEach(bc => {
        const v = dateMap[d][bc] || 0;
        rowTotal += v;
        branchColumnTotals[bc] += v;
      });
      dateTotals[d] = rowTotal;
      grand += rowTotal;
    });

    // Cache the pivot so renderOfficeTable() can redraw either view instantly.
    currentOfficePivot = { code, branches, branchCodes, dates, dateMap, branchColumnTotals, dateTotals, grand };

    const abstractHtml = '<div class="cards">' +
      card('Days Recorded', dates.length) +
      card('Branches', branches.length) +
      card('Grand Total Collected', fmtMoney(grand), 'credit') +
      '</div>';
    document.getElementById('content').innerHTML = abstractHtml + '<div id="officeTableArea"></div>';
    renderOfficeTable();
  } catch (err) { showError(err); }

}

// Builds the header/body rows for whichever office view is active and hands
// them to onData(). officeTransposed === false (default): dates as rows,
// branch info as 3 sticky header rows. officeTransposed === true: dates as
// column headers, branch info (BRANCH / MIS CODE / BR.CODE) as the first 3
// frozen columns.
function renderOfficeTable() {
  if (!currentOfficePivot) return;
  const { branches, branchCodes, dates, dateMap, branchColumnTotals, dateTotals, grand } = currentOfficePivot;
  let rows;
  if (!officeTransposed) {
    const headerRows = [
      ['BRANCH'].concat(branches.map(b => b.name), ['ALL BRANCHES']),
      ['MIS CODE'].concat(branches.map(b => b.mis), ['—']),
      ['BR.CODE'].concat(branches.map(b => b.code), ['TOTAL'])
    ];
    const bodyRows = dates.map(d => {
      const values = branchCodes.map(bc => {
        const v = (dateMap[d] && dateMap[d][bc]) || 0;
        return v ? v.toFixed(2) : '';
      });
      const rowTotal = dateTotals[d] || 0;
      return [d].concat(values, [rowTotal ? rowTotal.toFixed(2) : '']);
    });
    // Bottom TOTAL row: per-branch column sums, with the grand total in the
    // 'ALL BRANCHES' column at the end so it lines up with the per-row totals.
    bodyRows.push(
      ['TOTAL'].concat(
        branchCodes.map(bc => branchColumnTotals[bc] ? branchColumnTotals[bc].toFixed(2) : ''),
        [grand ? grand.toFixed(2) : '']
      )
    );
    rows = headerRows.concat(bodyRows);
    onData(rows, 3, 'officeTableArea');
  } else {
    const headerRow = ['BRANCH', 'MIS CODE', 'BR.CODE'].concat(dates.map(d => formatDateDMY_(d)), ['TOTAL']);
    const bodyRows = branches.map(b => {
      const values = dates.map(d => {
        const v = (dateMap[d] && dateMap[d][b.code]) || 0;
        return v ? v.toFixed(2) : '';
      });
      const total = branchColumnTotals[b.code] || 0;
      return [b.name, b.mis, b.code].concat(values, [total ? total.toFixed(2) : '']);
    });
    // Bottom TOTAL row: BRANCH/MIS/BR.CODE cells left blank, per-date column
    // sums across, grand total in the final TOTAL column.
    bodyRows.push(
      ['TOTAL', '', ''].concat(
        dates.map(d => (dateTotals[d] ? dateTotals[d].toFixed(2) : '')),
        [grand ? grand.toFixed(2) : '']
      )
    );
    rows = [headerRow].concat(bodyRows);
    onData(rows, 1, 'officeTableArea');
  }
  const toggleBtn = document.getElementById('toggleViewBtn');
  if (toggleBtn) toggleBtn.textContent = officeTransposed ? '⇄ Dates as Rows' : '⇄ Dates as Columns';
}

document.getElementById('toggleViewBtn').addEventListener('click', () => {
  officeTransposed = !officeTransposed;
  renderOfficeTable();
});

function onData(rows, headerRowCount, targetId) {
  renderTargetId = targetId;
  if (!rows || rows.length === 0) {
    const target = document.getElementById(targetId);
    if (target) target.innerHTML = '<div class="state-msg">No data in this view yet.</div>';
    return;
  }
  currentHeaderRows = rows.slice(0, headerRowCount);
  currentRows = rows.slice(headerRowCount);
  const searchBox = document.getElementById('searchBox');
  if (searchBox) searchBox.value = '';
  page = 0;
  applyFilter('');
}

function applyFilter(term) {
  const t = term.trim().toLowerCase();
  filteredRows = !t ? currentRows : currentRows.filter(row => row.some(cell => String(cell).toLowerCase().indexOf(t) !== -1));
  page = 0;
  render();
}

function lastHeaderRow() { return currentHeaderRows[currentHeaderRows.length - 1] || []; }
// Identifies which table shape is currently rendered:
//  'office'   — office-wise tab, default view: dates as rows, 3 header rows
//               (BRANCH / MIS CODE / BR.CODE) for the branch columns.
//  'office-t' — office-wise tab, toggled view: dates as column headers,
//               BRANCH/MIS CODE/BR.CODE as the first 3 (frozen) columns.
//  'normal'   — Statement / Reversal / Branch-wise statement (unchanged).
function tableKind() {
  if (currentViewLabel.startsWith('office_')) return officeTransposed ? 'office-t' : 'office';
  return 'normal';
}
// Frozen (sticky-left) column count per table kind, and their pixel widths —
// only the office-wise tabs freeze columns, per the requested change.
function frozenColCount() {
  const k = tableKind();
  if (k === 'office') return 1;
  if (k === 'office-t') return 3;
  return 0;
}
function frozenColWidths() {
  const k = tableKind();
  if (k === 'office') return [110];
  if (k === 'office-t') return [190, 90, 90];
  return [];
}
function frozenColLeft(i) {
  const widths = frozenColWidths();
  let left = 0;
  for (let j = 0; j < i; j++) left += widths[j];
  return left;
}
function isNumericCol(i) {
  const k = tableKind();
  if (k === 'office') return i > 0;
  if (k === 'office-t') return i >= 3;
  const label = String(lastHeaderRow()[i] || '');
  return /debit|credit|balance/i.test(label);
}
function isWrapCol(i) {
  return /description/i.test(String(lastHeaderRow()[i] || ''));
}
function isDateCol(i) {
  const k = tableKind();
  // Default office pivot table always has the date as its first column,
  // regardless of header label (its header rows say 'BRANCH'/'MIS CODE'/'BR.CODE').
  if (k === 'office') return i === 0;
  // Transposed view has dates as column headers, not a data column.
  if (k === 'office-t') return false;
  return /^date$/i.test(String(lastHeaderRow()[i] || ''));
}
function colWidth(i) {
  const label = String(lastHeaderRow()[i] || '').toLowerCase();
  if (isWrapCol(i)) return null;
  if (/date/.test(label)) return '100px';
  if (/month/.test(label)) return '110px';
  if (label === 'branch') return '90px';
  if (/debit|credit|balance/.test(label)) return '130px';
  if (label === 'reversal') return '90px';
  return '110px';
}

function render() {
  const kind = tableKind();
  const isOfficeView = kind === 'office' || kind === 'office-t';
  const frozenCount = frozenColCount();
  const frozenWidths = frozenColWidths();
  const start = page * PAGE_SIZE;
  const pageRows = filteredRows.slice(start, start + PAGE_SIZE);

  let html = '<div class="table-wrap"><div class="table-scroll"><table class="' + (isOfficeView ? 'grid' : 'wrap-table') + '"><thead>';
  currentHeaderRows.forEach((hRow, ri) => {
    html += '<tr>';
    hRow.forEach((h, i) => {
      const align = isNumericCol(i) ? 'text-align:right' : '';
      const frozen = i < frozenCount;
      const w = frozen ? (frozenWidths[i] + 'px') : (isOfficeView ? null : colWidth(i));
      const widthStyle = w ? ('width:' + w + ';min-width:' + w + ';') : '';
      const wrapCls = (!isOfficeView && isWrapCol(i)) ? ' wrap' : '';
      let style = 'top:' + (ri * HEADER_ROW_HEIGHT) + 'px;' + align + widthStyle;
      // Frozen header cells are sticky on BOTH axes (top AND left) so the
      // branch/date corner stays pinned while scrolling either direction.
      if (frozen) {
        style += 'position:sticky;left:' + frozenColLeft(i) + 'px;z-index:4;background:#eef2f6;';
        if (i === frozenCount - 1) style += 'box-shadow:2px 0 4px -2px rgba(0,0,0,0.25);';
      }
      html += '<th class="' + wrapCls + '" style="' + style + '">' + escapeHtml_(h) + '</th>';
    });
    html += '</tr>';
  });
  html += '</thead><tbody>';

  pageRows.forEach(row => {
    const isTotalRow = row[0] === 'TOTAL';
    html += '<tr' + (isTotalRow ? ' class="total-row"' : '') + '>';
    row.forEach((cell, i) => {
      const label = String(lastHeaderRow()[i] || '').toLowerCase();
      let cls = isNumericCol(i) ? 'num' : '';
      if (!isOfficeView && isWrapCol(i)) cls += ' wrap';
      if (label === 'credit' && Number(String(cell).replace(/,/g,'')) > 0) cls += ' credit';
      if (label === 'debit' && Number(String(cell).replace(/,/g,'')) > 0) cls += ' debit';
      const numVal = Number(String(cell).replace(/,/g, ''));
      let display;
      if (isDateCol(i) && cell !== '' && cell !== 'TOTAL') {
        display = escapeHtml_(formatDateDMY_(cell));
      } else if (isNumericCol(i) && cell !== '' && !isNaN(numVal)) {
        display = fmtNum(numVal);
      } else {
        display = escapeHtml_(cell);
      }
      const frozen = i < frozenCount;
      let tdStyle = '';
      if (frozen) {
        cls += ' frozen-col';
        tdStyle = 'position:sticky;left:' + frozenColLeft(i) + 'px;z-index:1;background:' + (isTotalRow ? '#eef2f6' : '#ffffff') + ';';
        if (i === frozenCount - 1) tdStyle += 'box-shadow:2px 0 4px -2px rgba(0,0,0,0.25);';
      }
      html += '<td class="' + cls + '"' + (tdStyle ? ' style="' + tdStyle + '"' : '') + '>' + display + '</td>';
    });
    html += '</tr>';
  });
  html += '</tbody></table></div>';

  const totalPages = Math.max(1, Math.ceil(filteredRows.length / PAGE_SIZE));
  const hasTotalRow = filteredRows.length > 0 && filteredRows[filteredRows.length - 1][0] === 'TOTAL';
  const displayCount = filteredRows.length - (hasTotalRow ? 1 : 0);
  html += '<div class="pager">' +
    '<button id="prevBtn" ' + (page === 0 ? 'disabled' : '') + '>Previous</button>' +
    '<span>Page ' + (page + 1) + ' of ' + totalPages + ' — ' + displayCount + ' row(s)</span>' +
    '<button id="nextBtn" ' + (page >= totalPages - 1 ? 'disabled' : '') + '>Next</button>' +
    '</div></div>';

  const target = document.getElementById(renderTargetId);
  target.innerHTML = html;
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  if (prevBtn) prevBtn.onclick = () => { page--; render(); };
  if (nextBtn) nextBtn.onclick = () => { page++; render(); };
}

function fmtNum(n) {
  if (!n) return '';
  return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function escapeHtml_(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m]));
}

async function loadBranchStatement(code, name) {
  const area = document.getElementById('branchStatementArea');
  area.innerHTML = '<div class="state-msg">Loading transactions for ' + escapeHtml_(name) + '…</div>';
  try {
    const rows = await fetchSheet('Statement');
    const header = rows[0];
    const branchIdx = header.findIndex(h => /^branch$/i.test(h));
    const debitIdx = header.findIndex(h => /debit/i.test(h));
    const creditIdx = header.findIndex(h => /credit/i.test(h));
    const monthIdx = header.findIndex(h => /^month$/i.test(h));
    let matched = rows.slice(1).filter(r => String(r[branchIdx]).trim() === code);
    if (selectedMonth !== 'All') matched = matched.filter(r => r[monthIdx] === selectedMonth);
    let totalD = 0, totalC = 0;
    matched.forEach(r => {
      totalD += parseFloat(String(r[debitIdx]).replace(/,/g, '')) || 0;
      totalC += parseFloat(String(r[creditIdx]).replace(/,/g, '')) || 0;
    });
    const cardsHtml = '<div class="cards">' +
      card('Transactions', matched.length) +
      card('Total Credit', fmtMoney(totalC), 'credit') +
      card('Total Debit', fmtMoney(totalD), 'debit') +

    activeReload = () => loadBranchStatement(code, name);

    onData(appendTotalsRow(sortByDate_([header].concat(matched))), 1, 'branchTableInner');
  } catch (err) { area.innerHTML = '<div class="state-msg">Error: ' + escapeHtml_(err.message) + '</div>'; }
}

function loadImageAsDataUrl(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.width; canvas.height = img.height;
      canvas.getContext('2d').drawImage(img, 0, 0);
      resolve(canvas.toDataURL('image/png'));
    };
    img.onerror = reject;
    img.src = src;
  });
}
const BANK_INFO = {
  entity: 'ISLAMABAD ELECTRIC SUPPLY CO',
  branchLabel: '1028-ISLAMABAD SUPER MARKET',
  accountNo: '0102801010014543',
  iban: 'PK86MUCB0102801010014543'
};

function formatDateDMY_(val) {
  const d = new Date(val);
  if (isNaN(d.getTime())) return String(val);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const dd = String(d.getDate()).padStart(2, '0');
  return dd + '-' + months[d.getMonth()] + '-' + d.getFullYear();
}
function computeDateRange() {
  const kind = tableKind();
  // Transposed office view has dates as column headers, not a data column —
  // read the range from the cached pivot's (already ascending-sorted) dates.
  if (kind === 'office-t') {
    const dates = (currentOfficePivot && currentOfficePivot.dates) || [];
    if (dates.length === 0) return { from: '—', to: '—' };
    return { from: formatDateDMY_(dates[0]), to: formatDateDMY_(dates[dates.length - 1]) };
  }
  let dateIdx = 0;
  if (kind !== 'office') {
    dateIdx = lastHeaderRow().findIndex(h => /^date$/i.test(h));
    if (dateIdx === -1) dateIdx = 0;
  }
  // Exclude the appended TOTAL row — its first cell is the literal text
  // 'TOTAL', not a date, so it must never be sorted in with the real dates.
  const dataRows = filteredRows.filter(r => r[0] !== 'TOTAL');
  const dates = dataRows.map(r => r[dateIdx]).filter(Boolean);
  if (dates.length === 0) return { from: '—', to: '—' };
  const sorted = dates.slice().sort((a, b) => new Date(a) - new Date(b));
  return { from: formatDateDMY_(sorted[0]), to: formatDateDMY_(sorted[sorted.length - 1]) };
}

// covers the office items, which are added dynamically further below).
sideNav.addEventListener('click', e => {
  if (e.target.closest('.nav-item') && window.innerWidth <= 800) closeSidebar();
});

/* ---------------- Nav wiring ---------------- */
document.querySelector('[data-view="home"]').addEventListener('click', function () { setActiveNav(this); loadHome(); });
document.querySelector('[data-view="statement"]').addEventListener('click', function () { setActiveNav(this); loadStatement(); });
document.querySelector('[data-view="reversal"]').addEventListener('click', function () { setActiveNav(this); loadReversal(); });
document.querySelector('[data-view="branch"]').addEventListener('click', function () { setActiveNav(this); loadBranchView(); });

const officeNav = document.getElementById('officeNav');
OFFICE_CODES.forEach(code => {
  const item = document.createElement('div');
  item.className = 'nav-item';
  item.textContent = code;
  item.addEventListener('click', function () { setActiveNav(this); loadOffice(code); });
  officeNav.appendChild(item);
});

async function loadStatus() {
  try {
    const rows = await fetchSheet('Statement');
    const header = rows[0];
    const dateIdx = header.findIndex(h => /^date$/i.test(h));
    const last = rows.length > 1 ? rows[rows.length - 1][dateIdx] : '—';
    document.getElementById('lastUpdated').textContent = 'Last entry: ' + (last || '—');
  } catch (e) {
    document.getElementById('lastUpdated').textContent = 'Status unavailable';
  }
}

</script>
</body>
